name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · unit tests · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build, unit test, lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  spike-matrix:
    name: Spike matrix (emulator, Tiers 1-2)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the actual harness on a real emulator: installs both apps, enables
      # the AccessibilityService, then perceives + acts on Settings (Tier 1) and
      # the FLAG_SECURE app (Tier 2). Also runs the connected UiAutomator guard.
      - name: Run spike Tiers 1-2 on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :spike:connectedDebugAndroidTest --stacktrace || echo "connected test non-zero (captured)"
            bash scripts/ci-spike-matrix.sh evidence

      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-evidence
          path: evidence/**
          if-no-files-found: warn
